services:
  - type: web
    name: mcp-server
    env: bun
    rootDir: mcp-server
    buildCommand: bun install && bun run build
    startCommand: bun run start
    envVars:
      - key: BUN_VERSION
        value: 1.1.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
